pages:
  stage: deploy
  image: alpine:latest
  script:
    # GitLab Pages serves only the app privacy/support pages and app-ads.txt
    # (released Gridora builds link here). The portfolio is GitHub Pages only.
    - mkdir -p public-gitlab
    - for dir in public/*/; do cp -r "${dir%/}" public-gitlab/; done
    - for f in public/*.txt; do [ -e "$f" ] && cp "$f" public-gitlab/; done
    - rm -rf public && mv public-gitlab public
    - ls -la public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
