name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same layout as the GitLab `pages` job: every top-level app folder, the
      # root-level *.txt files (app-ads.txt must sit at the domain root), plus
      # the landing page.
      - name: Build site
        run: |
          mkdir -p _site
          for dir in */; do
            name="${dir%/}"
            [ "$name" = "_site" ] && continue
            cp -r "$dir" "_site/$name"
          done
          for f in *.txt; do [ -e "$f" ] && cp "$f" _site/; done
          cp index.html _site/
          ls -la _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
